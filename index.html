<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 호그와트 기숙사 대항전</title>
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f1e5ac;
            --dark-bg: #0a0a0c;
            --card-bg: rgba(30, 30, 40, 0.95);
            --gryffindor: #740001;
            --slytherin: #1a472a;
            --ravenclaw: #0e1a40;
            --hufflepuff: #ecb939;
            --text: #e0e0e0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes magicPulse {
            0% { box-shadow: 0 0 5px var(--gold); }
            50% { box-shadow: 0 0 20px var(--gold); }
            100% { box-shadow: 0 0 5px var(--gold); }
        }

        @keyframes scoreUp {
            0% { transform: scale(1); color: var(--text); }
            50% { transform: scale(1.2); color: var(--gold); }
            100% { transform: scale(1); color: var(--text); }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Crimson Text', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at center, rgba(20, 20, 30, 0.8), var(--dark-bg)),
                url('https://www.transparenttextures.com/patterns/dark-matter.png');
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        .container {
            width: 95%;
            max-width: 800px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--gold-light);
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold);
            color: white;
            border-radius: 5px;
            outline: none;
        }

        .house-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .house-option {
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: bold;
        }

        .house-option:hover {
            transform: scale(1.05);
            border-color: var(--gold);
        }

        .house-option.selected {
            border-width: 2px;
            box-shadow: 0 0 15px currentColor;
        }

        .house-gryffindor { color: var(--gryffindor); }
        .house-slytherin { color: var(--slytherin); }
        .house-ravenclaw { color: var(--ravenclaw); }
        .house-hufflepuff { color: var(--hufflepuff); }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, var(--gold), #b8860b);
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border-left: 4px solid var(--gold);
        }

        .player-info h2 { color: var(--gold); font-size: 1.2rem; }
        .player-info p { font-size: 0.9rem; opacity: 0.8; }
        .day-info { text-align: right; }
        .day-counter { font-size: 1.5rem; font-weight: bold; color: var(--gold); }

        .scoreboard {
            margin-bottom: 30px;
        }

        .house-score-row {
            margin-bottom: 15px;
        }

        .house-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .progress-bg {
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .game-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold);
            color: var(--text);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            transform: translateY(-5px);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-area {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 2px solid var(--gold);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        #reaction-target {
            width: 60px;
            height: 60px;
            background: var(--gold);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px var(--gold);
        }

        .focus-number {
            font-size: 3rem;
            color: var(--gold);
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .death-eater-panel {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid #ff0000;
            border-radius: 10px;
            background: rgba(255,0,0,0.05);
        }

        .death-eater-panel h3 { color: #ff4444; margin-bottom: 15px; }

        .side-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 0.8rem;
            border-radius: 5px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-small:hover {
            background: var(--gold);
            color: black;
        }

        .rank-list {
            text-align: left;
            margin: 20px 0;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .rank-item.winner {
            color: var(--gold);
            font-weight: bold;
            font-size: 1.2rem;
            border-bottom: 2px solid var(--gold);
        }

        .loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--dark-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .magic-circle {
            width: 100px;
            height: 100px;
            border: 4px double var(--gold);
            border-radius: 50%;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .game-menu { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">
        <div class="magic-circle"></div>
    </div>

    <div class="container">
        <div id="start-screen" class="card">
            <h1>🏰 호그와트 기숙사 대항전</h1>
            <div class="input-group">
                <label>마법사 닉네임</label>
                <input type="text" id="nickname-input" placeholder="이름을 입력하세요..." maxlength="10">
            </div>
            <div class="input-group">
                <label>기숙사 선택</label>
                <div class="house-selector">
                    <div class="house-option house-gryffindor" data-house="Gryffindor">그리핀도르</div>
                    <div class="house-option house-slytherin" data-house="Slytherin">슬리데린</div>
                    <div class="house-option house-ravenclaw" data-house="Ravenclaw">레번클로</div>
                    <div class="house-option house-hufflepuff" data-house="Hufflepuff">후플푸프</div>
                </div>
            </div>
            <div class="checkbox-group" onclick="toggleDeathEater()">
                <input type="checkbox" id="death-eater-check">
                <label style="margin-bottom: 0; cursor: pointer;">죽음을 먹는 자인가요?</label>
            </div>
            <button class="btn" onclick="startGame()">게임 시작</button>
        </div>

        <div id="game-screen" class="card hidden">
            <div class="game-header">
                <div class="player-info">
                    <h2 id="display-nickname">닉네임</h2>
                    <p id="display-house-role">기숙사 / 역할</p>
                </div>
                <div class="day-info">
                    <div class="day-counter" id="display-day">DAY 1 / DAY 10</div>
                </div>
            </div>

            <div class="scoreboard">
                <div class="house-score-row" id="score-Gryffindor">
                    <div class="house-label">
                        <span>그리핀도르</span>
                        <span class="score-val">0</span>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" style="background:var(--gryffindor)"></div></div>
                </div>
                <div class="house-score-row" id="score-Slytherin">
                    <div class="house-label">
                        <span>슬리데린</span>
                        <span class="score-val">0</span>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" style="background:var(--slytherin)"></div></div>
                </div>
                <div class="house-score-row" id="score-Ravenclaw">
                    <div class="house-label">
                        <span>레번클로</span>
                        <span class="score-val">0</span>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" style="background:var(--ravenclaw)"></div></div>
                </div>
                <div class="house-score-row" id="score-Hufflepuff">
                    <div class="house-label">
                        <span>후플푸프</span>
                        <span class="score-val">0</span>
                    </div>
                    <div class="progress-bg"><div class="progress-bar" style="background:var(--hufflepuff)"></div></div>
                </div>
            </div>

            <div class="game-menu">
                <button class="game-btn" onclick="startMiniGame('timing')">
                    <span>⏱️ 타이밍 게임</span>
                </button>
                <button class="game-btn" onclick="startMiniGame('reaction')">
                    <span>⚡ 순발력 게임</span>
                </button>
                <button class="game-btn" onclick="startMiniGame('focus')">
                    <span>🧠 포커스 게임</span>
                </button>
                <button class="game-btn" onclick="startMiniGame('creature')">
                    <span>🐉 신화동물 게임</span>
                </button>
            </div>

            <div id="de-panel" class="death-eater-panel hidden">
                <h3>💀 점수 강탈 패널</h3>
                <div class="input-group">
                    <input type="text" id="steal-phrase" placeholder="강탈 주문 문장 입력 (Morsmordre)">
                </div>
                <button class="btn-small" onclick="stealScore()">점수 강탈 실행</button>
                <p style="font-size: 0.7rem; margin-top: 10px; opacity: 0.6;">* 기숙사당 1회만 가능</p>
            </div>

            <div class="side-actions">
                <button class="btn-small" onclick="buyHint()">💡 힌트 구매 (20점)</button>
                <button class="btn-small" onclick="reportDeathEater()">🚩 죽음을 먹는 자 신고</button>
            </div>
        </div>

        <div id="result-screen" class="card hidden">
            <h1 id="result-title">🏆 최종 결과</h1>
            <div id="winner-banner" style="margin-bottom: 20px;"></div>
            <div class="rank-list" id="final-ranks"></div>
            <button class="btn" onclick="location.reload()">다시 하기</button>
        </div>
    </div>

    <div id="game-overlay" class="overlay hidden">
        <div class="game-area">
            <h2 id="overlay-title" style="color:var(--gold); margin-bottom: 20px;">게임 제목</h2>
            <div id="game-content"></div>
            <div id="game-timer" style="margin-top: 20px; font-weight: bold; color: var(--gold);"></div>
        </div>
    </div>

    <script>
        const state = {
            nickname: '',
            house: '',
            role: '학생',
            isDeathEater: false,
            day: 1,
            maxDay: 10,
            scores: { Gryffindor: 100, Slytherin: 100, Ravenclaw: 100, Hufflepuff: 100 },
            npcDeathEaterHouse: '',
            deathEaterFound: false,
            steals: { Gryffindor: false, Slytherin: false, Ravenclaw: false, Hufflepuff: false },
            hints: [
                "죽음을 먹는 자는 남성이다 (진실)",
                "죽음을 먹는 자는 슬리데린이 아니다 (진실)",
                "죽음을 먹는 자는 게임 우승 경험이 있다 (거짓)",
                "죽음을 먹는 자는 레번클로에 있다 (진실)",
                "죽음을 먹는 자는 뱀을 싫어한다 (거짓)"
            ]
        };

        const creatures = ["드래곤", "피닉스", "그리핀", "키메라", "페가수스", "유니콘", "바실리스크", "히포그리프"];

        window.onload = () => {
            setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1000);
            document.querySelectorAll('.house-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.house-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    state.house = opt.dataset.house;
                });
            });
            const houses = ['Gryffindor', 'Slytherin', 'Ravenclaw', 'Hufflepuff'];
            state.npcDeathEaterHouse = houses[Math.floor(Math.random() * houses.length)];
        };

        function toggleDeathEater() {
            const cb = document.getElementById('death-eater-check');
            cb.checked = !cb.checked;
        }

        function startGame() {
            const nickname = document.getElementById('nickname-input').value.trim();
            if (!nickname || !state.house) return alert('닉네임과 기숙사를 확인하세요!');
            state.nickname = nickname;
            state.isDeathEater = document.getElementById('death-eater-check').checked;
            state.role = state.isDeathEater ? '죽음을 먹는 자' : '학생';
            if (state.isDeathEater) {
                state.npcDeathEaterHouse = state.house;
                document.getElementById('de-panel').classList.remove('hidden');
            }
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            updateUI();
        }

        function updateUI() {
            document.getElementById('display-nickname').innerText = `✨ ${state.nickname}`;
            document.getElementById('display-house-role').innerText = `${getHouseName(state.house)} / ${state.role}`;
            document.getElementById('display-day').innerText = `DAY ${state.day} / ${state.maxDay}`;
            for (let h in state.scores) {
                const row = document.getElementById(`score-${h}`);
                const valEl = row.querySelector('.score-val');
                const bar = row.querySelector('.progress-bar');
                valEl.innerText = state.scores[h];
                bar.style.width = `${Math.min(100, (state.scores[h] / 500) * 100)}%`;
                valEl.style.animation = 'scoreUp 0.5s ease';
                setTimeout(() => valEl.style.animation = '', 500);
            }
            if (state.day > state.maxDay) finishGame();
        }

        function getHouseName(id) {
            return { Gryffindor: '그리핀도르', Slytherin: '슬리데린', Ravenclaw: '레번클로', Hufflepuff: '후플푸프' }[id] || id;
        }

        function startMiniGame(type) {
            const overlay = document.getElementById('game-overlay');
            const content = document.getElementById('game-content');
            const title = document.getElementById('overlay-title');
            overlay.classList.remove('hidden');
            content.innerHTML = '';
            document.getElementById('game-timer').innerText = '';

            if (type === 'timing') {
                title.innerText = '⏱️ 타이밍 게임';
                content.innerHTML = '<p>신호가 나타나면 즉시 클릭!</p>';
                setTimeout(() => {
                    content.innerHTML = '<p style="font-size:1.5rem">준비...</p>';
                    setTimeout(() => {
                        const startTime = performance.now();
                        content.innerHTML = '<button class="btn" id="timing-btn">지금 클릭!</button>';
                        document.getElementById('timing-btn').onclick = () => {
                            const diff = performance.now() - startTime;
                            let score = 50;
                            if (diff <= 50) score = 100;
                            else if (diff <= 100) score = 90;
                            else if (diff <= 200) score = 80;
                            else if (diff <= 300) score = 70;
                            endMiniGame(`반응: ${Math.floor(diff)}ms`, score);
                        };
                    }, 1000 + Math.random() * 2000);
                }, 1000);
            } else if (type === 'reaction') {
                title.innerText = '⚡ 순발력 게임';
                let clicks = 0, timeLeft = 10;
                content.innerHTML = '<div id="reaction-box" style="height:200px; position:relative; overflow:hidden; border:1px solid var(--gold);"></div>';
                const spawn = () => {
                    const t = document.createElement('div');
                    t.id = 'reaction-target'; t.innerText = '클릭!';
                    t.style.left = Math.random() * 400 + 'px'; t.style.top = Math.random() * 140 + 'px';
                    t.onclick = () => { clicks++; t.remove(); spawn(); };
                    document.getElementById('reaction-box').appendChild(t);
                };
                spawn();
                const inv = setInterval(() => {
                    document.getElementById('game-timer').innerText = `시간: ${--timeLeft}s`;
                    if (timeLeft <= 0) { clearInterval(inv); endMiniGame(`클릭: ${clicks}회`, clicks * 10); }
                }, 1000);
            } else if (type === 'focus') {
                title.innerText = '🧠 포커스 게임';
                const num = Math.floor(100000 + Math.random() * 899999).toString();
                content.innerHTML = `<p>숫자를 기억하세요</p><div class="focus-number">${num}</div>`;
                setTimeout(() => {
                    content.innerHTML = `<input type="text" id="focus-input" style="width:150px; text-align:center; font-size:1.5rem;"><br><button class="btn" onclick="checkFocus('${num}')">확인</button>`;
                }, 2000);
            } else if (type === 'creature') {
                title.innerText = '🐉 신화동물 게임';
                let count = 0, timeLeft = 30, used = [];
                content.innerHTML = `<input type="text" id="creature-input" placeholder="이름 입력..."><div id="clist" style="margin-top:10px;"></div>`;
                const input = document.getElementById('creature-input');
                input.onkeyup = () => {
                    if (creatures.includes(input.value) && !used.includes(input.value)) {
                        used.push(input.value); count++; input.value = '';
                        document.getElementById('clist').innerHTML += `<span>[${used[used.length-1]}]</span> `;
                    }
                };
                const inv = setInterval(() => {
                    document.getElementById('game-timer').innerText = `시간: ${--timeLeft}s`;
                    if (timeLeft <= 0) { clearInterval(inv); endMiniGame(`동물: ${count}마리`, count * 20); }
                }, 1000);
            }
        }

        function checkFocus(orig) {
            const val = document.getElementById('focus-input').value;
            endMiniGame(val === orig ? '정답!' : `오답! (${orig})`, val === orig ? 100 : 20);
        }

        function endMiniGame(msg, pScore) {
            let rank = pScore >= 100 ? 1 : pScore >= 70 ? 2 : pScore >= 40 ? 3 : 4;
            const points = [30, 20, 10, 5];
            state.scores[state.house] += points[rank-1];
            ['Gryffindor', 'Slytherin', 'Ravenclaw', 'Hufflepuff'].forEach(h => { if(h !== state.house) state.scores[h] += points[Math.floor(Math.random()*4)]; });
            document.getElementById('game-content').innerHTML = `<h3>${msg}</h3><p>${rank}등! 기숙사 +${points[rank-1]}점</p><button class="btn" onclick="closeOverlay()">다음</button>`;
            state.day++;
        }

        function closeOverlay() { document.getElementById('game-overlay').classList.add('hidden'); updateUI(); }

        function buyHint() {
            if (state.scores[state.house] < 20) return alert('점수 부족!');
            if (confirm('힌트를 구매하시겠습니까? (20점 차감)')) {
                state.scores[state.house] -= 20;
                alert(`📖 힌트: ${state.hints[Math.floor(Math.random()*state.hints.length)]}`);
                updateUI();
            }
        }

        function reportDeathEater() {
            const target = prompt('신고할 대상 입력');
            if (target && confirm(`정말 ${target}을(를) 신고하시겠습니까?`)) {
                if (target.toLowerCase() === state.npcDeathEaterHouse.toLowerCase()) {
                    alert('성공! 죽음을 먹는 자를 찾았습니다.'); state.deathEaterFound = true;
                } else {
                    alert('실패! 30점 감점.'); state.scores[state.house] -= 30;
                }
                updateUI();
            }
        }

        function stealScore() {
            if (document.getElementById('steal-phrase').value !== 'Morsmordre') return alert('주문 오류!');
            const target = prompt('강탈할 기숙사');
            if (state.scores[target] && !state.steals[target] && target !== state.house) {
                state.scores[target] -= 20; state.scores[state.house] += 20; state.steals[target] = true;
                alert('강탈 성공!'); updateUI();
            } else alert('강탈 불가!');
        }

        function finishGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            const sorted = Object.entries(state.scores)
                .map(([n, s]) => ({ n, s, d: (n === state.npcDeathEaterHouse && !state.deathEaterFound) }))
                .sort((a, b) => a.d - b.d || b.s - a.s);
            const list = document.getElementById('final-ranks');
            sorted.forEach((r, i) => {
                list.innerHTML += `<div class="rank-item ${i===0 && !r.d ? 'winner' : ''}"><span>${i+1}위: ${getHouseName(r.n)} ${r.d ? '(탈락)' : ''}</span><span>${r.s}점</span></div>`;
            });
            document.getElementById('winner-banner').innerHTML = sorted[0].d ? '<h2>어둠의 승리...</h2>' : `<h2>${getHouseName(sorted[0].n)} 우승!</h2>`;
        }
    </script>
</body>
</html>
